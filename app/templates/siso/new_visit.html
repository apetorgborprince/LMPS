{% extends "shared/base.html" %}{% block title %}Record Visit — LMPS{% endblock %}{% block page_title %}Record Monitoring Visit{% endblock %}{% block content %}<div class="panel"><div class="panel-body"><form method="POST">{{ csrf_token() }}<div class="field"><label>School</label><select name="school_assignment_id" required>{% for s in schools %}<option value="{{ s.assignment_id }}">{{ s.school_name }}{% if s.school_code %} ({{ s.school_code }}){% endif %}</option>{% endfor %}</select></div><div class="field"><label>Visit date</label><input type="date" name="visit_date" required></div><div class="field"><label>Visit type</label><select name="visit_type"><option>ROUTINE</option><option>FOLLOW_UP</option><option>SPECIAL</option><option>EMERGENCY</option></select></div><div class="field"><label>Purpose</label><textarea name="purpose" required></textarea></div><div class="field"><label>General observation</label><textarea name="general_observation"></textarea></div><button class="btn gold" type="submit">Save visit</button></form></div></div>{% endblock %}
